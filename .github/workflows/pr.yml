name: Pull request 🧪

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "Tests:checkout"
        uses: actions/checkout@v2

      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: "23.x"
          registry-url: "https://registry.npmjs.org"

      - name: "Enable corepack"
        run: corepack enable

      - name: "Install"
        run: pnpm

      - name: "Check"
        run: pnpm check

      - name: "Tests:run"
        run: docker compose run tests yarn test
