name: Publish 📦

on:
  release:
    types: [created]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: "Quality:checkout"
        uses: actions/checkout@v2

      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: "23.x"
          registry-url: "https://registry.npmjs.org"

      - name: "Enable corepack"
        run: corepack enable

      - name: "Install"
        run: pnpm i

      - name: "Check"
        run: pnpm check
  test:
    runs-on: ubuntu-latest
    steps:
      - name: "Tests:checkout"
        uses: actions/checkout@v2

      - name: "Tests:run"
        run: docker compose run tests pnpm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: "Publish:checkout"
        uses: actions/checkout@v2

      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: "23.x"
          registry-url: "https://registry.npmjs.org"
      - name: "Enable corepack"
        run: corepack enable

      - name: "Publish:install"
        run: pnpm i

      - name: "Publish:build"
        run: pnpm build

      - name: "Publish:publish package on NPM 📦"
        run: pnpm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
